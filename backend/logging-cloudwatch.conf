[loggers]
keys=root,app

[handlers]
keys=consoleHandler,detailedConsoleHandler,cloudwatchHandler

[formatters]
keys=normalFormatter,detailedFormatter,cloudwatchFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_app]
level=INFO
handlers=detailedConsoleHandler,cloudwatchHandler
qualname=app
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=normalFormatter
args=(sys.stdout,)

[handler_detailedConsoleHandler]
class=StreamHandler
level=INFO
formatter=detailedFormatter
args=(sys.stdout,)

[handler_cloudwatchHandler]
class=StreamHandler
level=INFO
formatter=cloudwatchFormatter
args=(sys.stdout,)

[formatter_normalFormatter]
format=[%(asctime)s] [%(process)d] [%(levelname)s] [%(name)s#%(funcName)s()#%(lineno)d] %(message)s
datefmt=%Y-%m-%d %H:%M:%S %z

[formatter_detailedFormatter]
format=[%(asctime)s] [%(process)d] [%(levelname)s] [%(pathname)s#%(funcName)s()#%(lineno)d] %(message)s
datefmt=%Y-%m-%d %H:%M:%S %z

[formatter_cloudwatchFormatter]
format={"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "function": "%(funcName)s", "line": %(lineno)d, "message": %(message)s}
datefmt=%Y-%m-%dT%H:%M:%S