<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <style>
        /* Reset styles */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        
        /* Base styles */
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f7;
            color: #333333;
            line-height: 1.6;
        }
        
        /* Container */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        
        /* Header */
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        
        /* Content */
        .email-content {
            padding: 40px;
        }
        
        .greeting {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 20px 0;
        }
        
        .message {
            font-size: 15px;
            color: #4a5568;
            margin: 0 0 20px 0;
            line-height: 1.7;
        }
        
        /* Notification Card */
        .notification-card {
            background-color: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 25px 0;
            border-radius: 4px;
        }
        
        .notification-card .title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin: 0 0 8px 0;
        }
        
        .notification-card .meta {
            font-size: 13px;
            color: #718096;
            margin: 0 0 12px 0;
        }
        
        .notification-card .content {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            margin: 0;
        }
        
        /* Button */
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        
        .button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        /* Footer */
        .email-footer {
            background-color: #f7fafc;
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        
        .email-footer p {
            font-size: 13px;
            color: #718096;
            margin: 8px 0;
            line-height: 1.5;
        }
        
        .email-footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .email-footer a:hover {
            text-decoration: underline;
        }
        
        /* Social links */
        .social-links {
            margin: 20px 0 10px 0;
        }
        
        .social-links a {
            display: inline-block;
            margin: 0 8px;
            color: #718096;
            text-decoration: none;
            font-size: 13px;
        }
        
        /* Preferences */
        .preferences {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 20px;
        }
        
        /* Mobile responsive */
        @media only screen and (max-width: 600px) {
            .email-content {
                padding: 30px 20px !important;
            }
            
            .email-header {
                padding: 20px !important;
            }
            
            .email-footer {
                padding: 20px !important;
            }
            
            .button {
                display: block !important;
                width: 100% !important;
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .email-container {
                background-color: #1a202c !important;
            }
            
            .email-content {
                background-color: #1a202c !important;
            }
            
            .greeting {
                color: #e2e8f0 !important;
            }
            
            .message {
                color: #cbd5e0 !important;
            }
            
            .notification-card {
                background-color: #2d3748 !important;
            }
            
            .notification-card .title {
                color: #e2e8f0 !important;
            }
            
            .notification-card .content {
                color: #cbd5e0 !important;
            }
        }
    </style>
</head>
<body>
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
            <td style="padding: 20px 0;">
                <table role="presentation" class="email-container" cellspacing="0" cellpadding="0" border="0" width="600" align="center">
                    <!-- Header -->
                    <tr>
                        <td class="email-header">
                            <a href="{{ app_url }}" class="logo">{{ app_name }}</a>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td class="email-content">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td class="email-footer">
                            <p><strong>{{ app_name }}</strong></p>
                            <p>Discover and share reviews with your community</p>
                            
                            <div class="social-links">
                                <a href="{{ social_twitter }}">Twitter</a> • 
                                <a href="{{ social_instagram }}">Instagram</a> • 
                                <a href="{{ social_facebook }}">Facebook</a>
                            </div>
                            
                            <p style="margin-top: 20px;">
                                <a href="{{ app_url }}/settings/notifications">Notification Settings</a> • 
                                <a href="{{ app_url }}/help">Help Center</a>
                            </p>
                            
                            <p class="preferences">
                                You're receiving this email because of your activity on {{ app_name }}.<br>
                                <a href="{{ unsubscribe_url }}">Unsubscribe</a> from these notifications.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
